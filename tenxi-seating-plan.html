<title>Tenxi Seating Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF4E4;--paper:#FFFCF4;--ink:#2B1B5A;--purple:#5B3A99;--pink:#EE3F6C;--magenta:#C0407E;--amber:#F7B32B;--green:#14A44D;--yellow:#F4E04D;--muted:#7A6F95;--line:#E4D9BE;--L:#FFF0CC;--P:#FFE1EA;
--disp:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 var(--body)}
.band{height:8px;background:linear-gradient(100deg,var(--pink) 0 22%,var(--amber) 22% 46%,var(--magenta) 46% 62%,var(--amber) 62% 100%)}
.hidden{display:none!important}
button{font-family:inherit}
/* header */
.top{display:flex;align-items:center;gap:14px;padding:14px 0;max-width:1240px;margin:0 auto}
.logos{display:flex;align-items:center;gap:10px}
.logos img{display:block;height:50px;width:auto}
.logos .lc{border-radius:12px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.brand h1{margin:0;font:800 26px/1 var(--disp);letter-spacing:-.01em;color:var(--purple);text-shadow:2px 2px 0 rgba(247,179,43,.9)}
.brand p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.top .sp{flex:1}
nav.tabs{max-width:1240px;margin:0 auto;padding:0;display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;font:600 14px var(--body);color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}
.wrap{max-width:1240px;margin:0 auto;padding:20px 0}
footer{max-width:1240px;margin:0 auto;padding:10px 0 34px;color:var(--muted);font-size:13px}
/* buttons */
.btn{font:600 14px var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--purple);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.flat{box-shadow:none;border-color:var(--line);color:var(--muted)}
.btn.flat:hover{transform:none;border-color:var(--ink);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
/* forms */
input[type=text],input[type=password],select,textarea{font:500 15px var(--body);color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font:600 13px var(--body);margin:0 0 5px;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:150px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;font:600 14px var(--body);color:var(--ink);cursor:pointer}
.seg button.on[data-g=L]{background:var(--amber)}
.seg button.on[data-g=P]{background:var(--pink);color:#fff}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:4px 4px 0 rgba(43,27,90,.9)}
.card+.card{margin-top:18px}
.card h2{margin:0 0 4px;font:800 19px var(--disp)}
.card .hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.muted{color:var(--muted)}
.chip{display:inline-block;font:600 11px var(--body);padding:2px 8px;border-radius:99px;border:1.5px solid var(--ink)}
.chip.L{background:var(--L)}.chip.P{background:var(--P)}.chip.g{background:#D9F2E3;border-color:var(--green)}.chip.o{background:#FFF;border-color:var(--line);color:var(--muted)}
/* plan */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stat{font-size:13.5px;color:var(--muted)}
.stat b{color:var(--ink)}
.note{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:#FFF4D6;border:1.5px solid #E9C25A;font-size:13.5px}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.stepper b{min-width:22px;text-align:center}
.stepper button{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);background:#fff;font:700 16px/1 var(--body);cursor:pointer}
.stepper button:hover{background:var(--yellow)}
.plan-scroll{overflow-x:auto;padding:8px 6px 16px}
.teacher{margin:0 auto 18px;width:230px;text-align:center;background:var(--purple);color:#fff;border-radius:10px;padding:8px;font:800 13px var(--disp);letter-spacing:.12em;box-shadow:3px 3px 0 var(--ink)}
.grid{display:grid;gap:12px;grid-template-columns:46px repeat(var(--cols),minmax(150px,1fr));align-items:stretch}
.rl{align-self:center;text-align:right;padding-right:2px;font:600 11px var(--body);color:var(--muted)}
.desk{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px;box-shadow:3px 3px 0 rgba(43,27,90,.85)}
.dn{font:800 10.5px var(--disp);letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seat{min-height:48px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;padding:4px 7px;text-align:left;font:600 13px/1.2 var(--body);color:var(--ink);display:flex;flex-direction:column;justify-content:center;overflow:hidden;min-width:0}
button.seat{cursor:pointer}
.seat.L{background:var(--L);border:1.5px solid #E9C25A}
.seat.P{background:var(--P);border:1.5px solid #EE9DB4}
.seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{font-weight:500;font-size:10px;color:var(--muted)}
.seat.sel{outline:3px solid var(--green);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.mini .grid{grid-template-columns:40px repeat(var(--cols),minmax(110px,1fr));gap:8px}
.mini .desk{padding:6px;box-shadow:2px 2px 0 rgba(43,27,90,.7)}
.mini .seat{min-height:38px;font-size:12px}
/* lists */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:14px}
.item{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px}
.item .t{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.d{display:block;padding:0}
details.h{background:#fff;border:2px solid var(--ink);border-radius:12px;margin-top:12px;box-shadow:3px 3px 0 rgba(43,27,90,.85)}
details.h summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.h summary::-webkit-details-marker{display:none}
details.h summary .tt{font:800 15px var(--disp)}
details.h .body{padding:4px 14px 14px;border-top:2px dashed var(--line)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.sub{grid-template-columns:1fr}.brand h1{font-size:21px}.logos img{height:40px}}
/* gate */

#gate .mid{flex:1;display:grid;place-items:center;padding:20px}
.gbox{width:min(400px,100%);text-align:center}
.gbox .logos{justify-content:center;margin-bottom:14px}
.gbox .logos img{height:74px}
.gbox h1{margin:0;font:800 32px var(--disp);color:var(--purple);text-shadow:2px 2px 0 rgba(247,179,43,.9)}
.gbox p{margin:4px 0 16px;color:var(--muted)}
.err{color:var(--pink);font-weight:600;font-size:13.5px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}

#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .sp{flex:1}.top .logos,.top .brand{min-width:0}
#topr{display:flex;gap:8px;align-items:center}
.card h3{margin:16px 0 8px;font:800 15px var(--disp)}
.ov{position:fixed;inset:0;background:rgba(43,27,90,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{width:min(420px,100%)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
@media(max-width:560px){.top{flex-wrap:wrap}.top .sp{display:none}#topr{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $=s=>document.querySelector(s);
const LKEY='tenxi.local.v2';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>new Date(ts).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

const defS=()=>({students:[],layout:{cols:4,desks:18},current:null,resetAt:0,pw:{}});
const defX=()=>({pw:null,block:[],lock:[]});
let S=defS(), X=defX(), H=[];            // state, private area, history
let db=null, dlcap=null, writable=true, loaded=false, sel=null, newG='P', tab='plan';
let editing=ss.get('tenxi.ok')==='1';
let defMain='', defSecret='';
const canEdit=()=>editing&&writable;

async function sha(s){
  try{ if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tenxi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');} }catch(e){}
  let h=5381;for(const c of 'tenxi:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200);}
const lk=id=>S.students.find(s=>s.id===id);
const nObj=id=>id?(lk(id)||{id,name:'(dihapus)',g:''}):null;

/* ---------- dialog di dalam halaman (confirm/alert tidak tersedia di viewer) ---------- */
function openDlg(html){const ov=$('#ov');$('#dlgbox').innerHTML=html;ov.classList.remove('hidden');const f=$('#dlgbox').querySelector('input,button.pri');if(f)f.focus();}
function closeDlg(){$('#ov').classList.add('hidden');$('#dlgbox').innerHTML='';}
function ask(msg,ok='Lanjut'){
  return new Promise(res=>{
    openDlg(`<p style="margin:0 0 16px;font-size:15px">${esc(msg)}</p><div class="row end"><button class="btn flat" id="dn">Batal</button><button class="btn pri" id="dy">${esc(ok)}</button></div>`);
    $('#dy').onclick=()=>{closeDlg();res(true)};$('#dn').onclick=()=>{closeDlg();res(false)};
    $('#ov').onkeydown=e=>{if(e.key==='Escape'){closeDlg();res(false)}};
  });
}
function loginDlg(){
  openDlg(`<h2 style="margin:0 0 4px;font:800 20px var(--disp)">Masuk untuk mengedit</h2><p class="hint" style="margin:0 0 12px">Siapa pun bisa melihat denah dan riwayat. Kata sandi dibutuhkan untuk mengacak dan mengubah data.</p>
  <form data-form="login"><input type="password" id="pw" placeholder="Kata sandi" autocomplete="off"><div class="err" id="gerr"></div>
  <div class="row end" style="margin-top:8px"><button type="button" class="btn flat" data-act="closeDlg">Batal</button><button class="btn pri" type="submit">Masuk</button></div></form>`);
  $('#ov').onkeydown=e=>{if(e.key==='Escape')closeDlg()};
}

/* ---------- penyimpanan: database bersama, cadangan lokal bila tidak tersedia ---------- */
let refS,refX,colP,lastS='',lastX='';
const stripS=()=>{const {history,...r}=S;return r;};
const Q={};
function persist(key,ref,get){
  const s=Q[key]=Q[key]||{busy:false,dirty:false};s.dirty=true;if(s.busy)return;
  (async()=>{s.busy=true;

/* ---------- pairing logic ---------- */
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const live=()=>S.history.filter(h=>h.ts>S.resetAt);
function usedSet(){const s=new Set();for(const h of live())for(const d of h.seats)if(d[0]&&d[1])s.add(pk(d[0].id,d[1].id));return s;}
/* Belakang = dua baris terakhir. Baris paling belakang berbobot 1, satu baris di depannya 0.6. */
function backScores(){const sc={},W=[1,.6];for(const h of live()){const rows=Math.ceil(h.seats.length/h.cols);h.seats.forEach((d,i)=>{const rank=rows-1-Math.floor(i/h.cols),w=W[rank]||0;if(w)for(const s of d)if(s)sc[s.id]=(sc[s.id]||0)+w;});}return sc;}

function makePairs(list){
  const used=usedSet(), blk=new Set(X.block.map(([a,b])=>pk(a,b)));
  const ok=(a,b)=>!(a.g==='L'&&b.g==='L')&&!used.has(pk(a.id,b.id))&&!blk.has(pk(a.id,b.id));
  const cost=(a,b)=>(a.g==='P'&&b.g==='P')?1:0;
  const nL=list.filter(s=>s.g==='L').length,nP=list.length-nL;
  const lb=nL>=nP?(nL-nP)*10:(Math.floor((nP-nL)/2)+((nP-nL)%2)*10);
  const cand=new Map(list.map(s=>[s.id,list.filter(t=>t.id!==s.id&&ok(s,t))]));
  let best=null,bestCost=Infinity;
  for(let at=0;at<40&&bestCost>lb;at++){
    const order=[...list].sort((a,b)=>(cand.get(a.id).length+Math.random()*4)-(cand.get(b.id).length+Math.random()*4));
    const done=new Set(),cur=[];let nodes=0;
    const rec=(i,c)=>{
      if(c>=bestCost||nodes++>15000)return;
      while(i<order.length&&done.has(order[i].id))i++;
      if(i>=order.length){best=cur.map(p=>p.slice());bestCost=c;return;}
      const s=order[i];done.add(s.id);
      const opts=cand.get(s.id).filter(t=>!done.has(t.id)).map(t=>[t,cost(s,t)+Math.random()*.5]).sort((x,y)=>x[1]-y[1]);
      for(const [t] of opts){done.add(t.id);cur.push([s,t]);rec(i+1,c+cost(s,t));cur.pop();done.delete(t.id);if(bestCost<=lb)break;}
      cur.push([s]);rec(i+1,c+10);cur.pop();
      done.delete(s.id);
    };
    rec(0,0);
  }
  return best||list.map(s=>[s]);
}
function place(units){
  const N=S.layout.desks,cols=S.layout.cols,sc=backScores();
  const rowOf=i=>Math.floor(i/cols)+1;
  const lockOf=id=>{const r=X.lock.filter(l=>l.id===id);return r.length?new Set(r.map(l=>l.row)):null;};
  const score=u=>u.reduce((a,s)=>a+(sc[s.id]||0),0)/u.length+Math.random()*.4;
  const fill=u=>{const m=u.map(s=>s.id); if(Math.random()<.5)m.reverse(); return [m[0]||null,m[1]||null];};
  const seats=Array.from({length:N},()=>[null,null]),left=[],warn=[],free=new Set([...Array(N).keys()]),rest=[];
  for(const u of units){
    let allowed=null;
    for(const s of u){const L=lockOf(s.id);if(L)allowed=allowed?new Set([...allowed].filter(x=>L.has(x))):L;}
    if(allowed){
      const opts=[...free].filter(i=>allowed.has(rowOf(i)));
      if(opts.length){const i=opts[Math.floor(Math.random()*opts.length)];free.delete(i);seats[i]=fill(u);continue;}
      warn.push(u.map(s=>s.name).join(' dan '));
    }
    rest.push(u);
  }
  const sorted=rest.map(u=>({u,k:score(u)})).sort((a,b)=>b.k-a.k).map(x=>x.u);
  const order=[...free].sort((a,b)=>a-b);
  sorted.forEach((u,k)=>{ if(k>=order.length){left.push(...u.map(s=>s.id));return;} seats[order[k]]=fill(u); });
  return {seats,left,warn};
}

function grid(seats,cols,o={}){
  const rows=Math.ceil(seats.length/cols);let h=`<div class="grid" style="--cols:${cols}">`;
  for(let r=0;r<rows;r++){
    h+=`<div class="rl">Baris ${r+1}</div>`;
    for(let c=0;c<cols;c++){
      const i=r*cols+c; if(i>=seats.length){h+='<div></div>';continue;}
      h+=`<div class="desk"><div class="dn">MEJA ${i+1}</div><div class="seats">`;
      for(let k=0;k<2;k++){
        const s=seats[i][k], on=o.sel&&o.sel[0]===i&&o.sel[1]===k?' sel':'';
        const inner=s?`<span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><small>${s.g==='L'?'Siswa':s.g==='P'?'Siswi':''}</small>`:`<small>kosong</small>`;
        h+=o.live?`<button class="seat ${s?s.g:''}${on}" data-act="seat" data-d="${i}" data-k="${k}">${inner}</button>`:`<div class="seat ${s?s.g:''}">${inner}</div>`;
      }
      h+='</div></div>';
    }
  }
  return h+'</div>';
}

  rr(W/2-90,88,180,30,8,'#5B3A99');x.fillStyle='#fff';x.textAlign='center';x.font='800 13px "Bricolage Grotesque",system-ui,sans-serif';x.fillText('MEJA GURU',W/2,108);
  seats.forEach((d,i)=>{
    const ox=20+(i%cols)*(dw+gap),oy=134+Math.floor(i/cols)*(dh+gap);
    rr(ox,oy,dw,dh,10,'#FFFCF4','#2B1B5A');
    x.textAlign='left';x.fillStyle='#7A6F95';x.font='800 10px "Bricolage Grotesque",system-ui,sans-serif';x.fillText('MEJA '+(i+1),ox+10,oy+18);
    d.forEach((s,k)=>{
      const sx=ox+8+k*((dw-24)/2+8),sw=(dw-24)/2;
      rr(sx,oy+26,sw,56,8,s?(s.g==='L'?'#FFF0CC':s.g==='P'?'#FFE1EA':'#eee'):null,s?(s.g==='L'?'#E9C25A':'#EE9DB4'):'#E4D9BE');
      x.textAlign='left';x.fillStyle='#2B1B5A';x.font='600 12px "Instrument Sans",system-ui,sans-serif';
      let nm=s?s.name:'kosong';while(x.measureText(nm).width>sw-14&&nm.length>2)nm=nm.slice(0,-2);if(s&&nm!==s.name)nm+='…';
      x.fillText(nm,sx+7,oy+50);
    });
  });
  c.toBlob(b=>b?saveFile('tenxi-seating.png',b):toast('Gagal membuat gambar.'));
}

/* ---------- actions ---------- */
const need=()=>{if(!canEdit()){toast(editing?'Akun ini hanya bisa melihat.':'Masuk dulu untuk mengedit.');return false;}return true;};
const act={
  tab(b){tab=b.dataset.t;document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));['plan','students','history','private','settings'].forEach(t=>$('#v-'+t).classList.toggle('hidden',t!==tab));},
  login(){loginDlg();},
  closeDlg(){closeDlg();},
  logout(){ss.del('tenxi.ok');editing=false;renderAll();},
  g(b){newG=b.dataset.g;document.querySelectorAll('#gseg button').forEach(x=>x.classList.toggle('on',x.dataset.g===newG));},
  tg(b){if(!need())return;const s=lk(b.dataset.id);s.g=s.g==='L'?'P':'L';saveS();renderAll();},
  async del(b){if(!need())return;const s=lk(b.dataset.id);if(!await ask('Hapus '+s.name+' dari daftar?','Hapus'))return;
    S.students=S.students.filter(x=>x.id!==s.id);X.block=X.block.filter(p=>!p.includes(s.id));X.lock=X.lock.filter(l=>l.id!==s.id);
    if(S.current){S.current.seats=S.current.seats.map(d=>d.map(i=>i===s.id?null:i));S.current.left=(S.current.left||[]).filter(i=>i!==s.id);}saveS();saveX();renderAll();},
  async shuffle(){
    if(!need())return;
    if(!S.students.length)return toast('Tambahkan siswa dulu di tab Siswa.');
    if(S.current&&!S.current.saved&&!await ask('Draf saat ini belum disimpan. Acak ulang?','Acak ulang'))return;
    const units=makePairs(S.students),r=place(units);sel=null;
    const lp=units.filter(u=>u.length===2&&u[0].g!==u[1].g).length,pp=units.filter(u=>u.length===2&&u[0].g===u[1].g).length,sg=units.filter(u=>u.length===1).length;
    const nL=S.students.filter(s=>s.g==='L').length,nP=S.students.length-nL,nat=nL>=nP?nL-nP:(nP-nL)%2;
    let note=`${lp} pasangan siswa–siswi`+(pp?`, ${pp} siswi–siswi`:'')+(sg?`, ${sg} duduk sendiri`:'')+'.';
    if(sg>nat)note+=' Kombinasi baru hampir habis. Pertimbangkan Reset pasangan di tab Riwayat.';
    if(r.warn.length)note+=' Kunci baris tidak bisa dipenuhi untuk: '+r.warn.join(', ')+'.';
    S.current={seats:r.seats,left:r.left,saved:false,note};saveS();renderPlan();
  },
  async savePlan(){
    if(!need()||!S.current)return;const snap=id=>{const s=lk(id);return s?{id:s.id,name:s.name,g:s.g}:null;};
    const h={id:uid(),ts:Date.now(),cols:S.layout.cols,label:($('#lbl').value||'').trim(),seats:S.current.seats.map(d=>d.map(snap))};
    S.current.saved=true;saveS();await putPlan(h);S.history=H;renderAll();toast('Tersimpan ke riwayat.');
  },
  async clearDraft(){if(!need())return;if(!await ask('Kosongkan denah saat ini?','Kosongkan'))return;S.current=null;sel=null;saveS();renderPlan();},
  seat(b){
    if(!need())return;
    const d=+b.dataset.d,k=+b.dataset.k;
    if(!sel){sel=[d,k];}else{const [a,c]=sel,s=S.current.seats;[s[a][c],s[d][k]]=[s[d][k],s[a][c]];sel=null;S.current.saved=false;saveS();}
    renderPlan();
  },
  async desks(b){if(!need())return;const v=+b.dataset.v,n=Math.min(60,Math.max(1,S.layout.desks+v));if(n===S.layout.desks)return;
    if(S.current&&v<0&&S.current.seats[n]&&S.current.seats[n].some(Boolean)&&!await ask('Meja terakhir terisi. Siswanya jadi belum kebagian kursi. Lanjut?','Kurangi meja'))return;
    S.layout.desks=n;if(S.current){normalize();S.current.saved=false;}saveS();renderPlan();},
  cols(b){if(!need())return;const n=Math.min(12,Math.max(1,S.layout.cols+(+b.dataset.v)));S.layout.cols=n;if(S.current)S.current.saved=false;saveS();renderPlan();},
  png(b){png(b.dataset.src);},csv(b){csv(b.dataset.src);},
  async hdel(b){if(!need())return;if(!await ask('Hapus denah ini dari riwayat?','Hapus'))return;await delPlan(b.dataset.id);S.history=H;renderAll();},
  async reset(){if(!need())return;if(!await ask('Reset pasangan? Semua siswa boleh sebangku lagi dan prioritas baris belakang dihitung ulang. Denah lama tetap jadi arsip.','Reset'))return;S.resetAt=Date.now();saveS();renderAll();toast('Pasangan direset.');},
  lock(){ss.del('tenxi.secret');renderPrivate();},
  bdel(b){X.block.splice(+b.dataset.i,1);saveX();renderPrivate();},
  ldel(b){X.lock.splice(+b.dataset.i,1);saveX();renderPrivate();},
  export(){saveFile('tenxi-cadangan.json',JSON.stringify({siswa:S.students,tata_letak:S.layout,denah_terbaru:S.current,riwayat:S.history,reset_pada:S.resetAt,larangan:{pasangan:X.block,kunci_baris:X.lock}},null,1));}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&act[b.dataset.act])act[b.dataset.act](b,e);});

const forms={
  async login(){const h=await sha($('#pw').value);if(h===(S.pw.main||defMain)){ss.set('tenxi.ok','1');editing=true;closeDlg();renderAll();toast(writable?'Mode edit aktif.':'Kata sandi benar, tetapi akun ini hanya bisa melihat.');}else{$('#gerr').textContent='Kata sandi salah.';$('#pw').select();}},
  addStudent(){if(!need())return;const n=$('#sn').value.trim().replace(/\s+/g,' ');if(!n)return;if(S.students.some(s=>s.name.toLowerCase()===n.toLowerCase()))return toast('Nama sudah ada.');
    S.students.push({id:uid(),name:n,g:newG});saveS();renderAll();$('#sn').focus();},
  bulk(){
    if(!need())return;
    let add=0;for(const line of $('#bulk').value.split('\n')){const t=line.trim();if(!t)continue;
      const m=t.match(/^(.*?)[\s,;\-–(]+([LPlp])\)?$/);let name=(m?m[1]:t).trim().replace(/\s+/g,' '),g=m?m[2].toUpperCase():newG;
      if(!name||S.students.some(s=>s.name.toLowerCase()===name.toLowerCase()))continue;S.students.push({id:uid(),name,g});add++;}
    saveS();renderAll();toast(add+' siswa ditambahkan.');},
  async unlock(){const h=await sha($('#spw').value);if(h===(X.pw||defSecret)){ss.set('tenxi.secret','1');renderPrivate();}else{$('#serr').textContent='Kata sandi salah.';}},
  addBlock(){const a=$('#ba').value,b=$('#bb').value;if(!a||!b||a===b)return toast('Pilih dua siswa yang berbeda.');
    if(X.block.some(p=>pk(p[0],p[1])===pk(a,b)))return toast('Pasangan sudah ada.');X.block.push([a,b]);saveX();renderPrivate();},
  addLock(){const id=$('#la').value,row=+$('#lr').value;if(!id)return toast('Pilih siswa.');
    if(X.lock.some(l=>l.id===id&&l.row===row))return toast('Kunci itu sudah ada.');X.lock.push({id,row});saveX();renderPrivate();},
  async pw(f){const w=f.dataset.w,o=f.o.value,n=f.n.value;if(!need())return;if(n.length<4)return toast('Sandi baru minimal 4 karakter.');
    if(w==='main'){if(await sha(o)!==(S.pw.main||defMain))return toast('Sandi saat ini salah.');S.pw.main=await sha(n);saveS();}
    else{if(await sha(o)!==(X.pw||defSecret))return toast('Sandi saat ini salah.');X.pw=await sha(n);saveX();}
    f.reset();toast('Kata sandi diganti.');}
};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form]?.(f);});
boot();

</script>
